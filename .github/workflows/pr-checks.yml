name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          standalone: true
          run_install: false

      - name: Install Node.js
        run: pnpm env use --global 24
        shell: bash

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Covers internal links in HTML/component attributes, which the VitePress
      # build's dead-link check does not inspect.
      - name: Link check
        run: pnpm check:links

      - name: Build
        run: pnpm build

  typo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate markdown schema
        uses: jackchuka/mdschema@246aae8f01ae2c2e38dcde50a00135929093de77 # v0.15.1
        with:
          files: "README.md docs/**/*.md"
          schema: "schema.yml"
