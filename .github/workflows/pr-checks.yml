name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          standalone: true
          run_install: false

      - name: Install Node.js
        run: pnpm env use --global 24
        shell: bash

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      # docs-sync is a separate npm project that the root typecheck does not
      # cover. It runs on Node's type stripping, so nothing checks its types at
      # runtime — without this the sync workflows only fail on the nightly cron.
      - name: Install docs-sync dependencies
        working-directory: scripts/docs-sync
        run: npm ci

      - name: Typecheck docs-sync
        working-directory: scripts/docs-sync
        run: npm run typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Covers internal links in HTML/component attributes, which the VitePress
      # build's dead-link check does not inspect.
      - name: Link check
        run: pnpm check:links

      - name: Build
        run: pnpm build

  typo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate markdown schema
        uses: jackchuka/mdschema@c6c04c75292369e8105a358416392da6947c51d6 # v0.15.2
        with:
          files: "README.md docs/**/*.md"
          schema: "schema.yml"
